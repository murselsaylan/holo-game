name: HOLO App Store page

# Fills the App Store product page through the App Store Connect API (tools/asc_store.py, store_assets/appstore.json):
# texts in every language, screenshots, categories, age rating, price, the build. Same API key as the TestFlight build.
#   git tag store-v1.0.7 && git push origin store-v1.0.7     -> page only
#   git tag submit-v1.0.7 && git push origin submit-v1.0.7   -> page + send to App Review
#   git tag iap-1 && git push origin iap-1                     -> In-App Purchases (tools/asc_iap.py)
#   git tag status-1 && git push origin status-1               -> review / build / IAP states (read only)
on:
  workflow_dispatch:
  push:
    tags: ['store-v*', 'submit-v*', 'resubmit-v*', 'feedback-*', 'iap-*', 'status-*']

permissions:
  contents: write                     # the run's output is pushed to the ci-logs branch (readable without the web UI)

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyjwt[crypto]" requests pygame
      - name: Product page
        env:
          ASC_KEY_ID: HU859PN88B
          ASC_ISSUER_ID: d24b4319-f096-4bd2-8998-5e322d50bb39
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF_NAME" == feedback-* ]]; then
            python tools/asc_feedback.py 2>&1 | tee "$RUNNER_TEMP/store.log"
          elif [[ "$GITHUB_REF_NAME" == status-* ]]; then
            python tools/asc_status.py 2>&1 | tee "$RUNNER_TEMP/store.log"
          elif [[ "$GITHUB_REF_NAME" == iap-* ]]; then
            python tools/asc_iap.py 2>&1 | tee "$RUNNER_TEMP/store.log"
          else
            if [[ "$GITHUB_REF_NAME" == submit-v* ]]; then A=--submit; elif [[ "$GITHUB_REF_NAME" == resubmit-v* ]]; then A=--resubmit; else A=; fi
            W=$(echo "$GITHUB_REF_NAME" | sed -n 's/.*-b\([0-9][0-9]*\)$/--wait-build=\1/p')   # ...-b13: wait for build 13
            python tools/asc_store.py $A $W 2>&1 | tee "$RUNNER_TEMP/store.log"
          fi
      - name: Keep the output (branch ci-logs)
        if: always()
        run: |
          cp "$RUNNER_TEMP/store.log" /tmp/store.log 2>/dev/null || echo "no log" > /tmp/store.log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs FETCH_HEAD || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/store.log "store-$GITHUB_REF_NAME.log"
          git add "store-$GITHUB_REF_NAME.log"
          git commit -qm "store log $GITHUB_REF_NAME $GITHUB_RUN_NUMBER [skip ci]"
          git push -q origin HEAD:ci-logs
