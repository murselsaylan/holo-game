name: Build HOLO iOS

# Builds the iOS app on GitHub's macOS machines (no Mac needed) and runs it in the iOS simulator.
# Actions -> "Build HOLO iOS" -> Run workflow. Artifacts:
#   holo-ios-simulator   HOLO.app for the iOS simulator (zip)
#   holo-ios-screens     simulator screenshots + the app's log (did it start, any Python error)
# A build for real iPhones / TestFlight needs an Apple Developer account (signing) - not set up yet.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.py', 'assets/**', 'levels/**', 'config.json', '.github/workflows/ios.yml']

defaults:
  run:
    shell: bash -eo pipefail {0}     # a failing xcodebuild fails the step even when piped to tail

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools
        run: pip install pygame-ios requests pygame-ce==2.5.6
      - name: Xcode project
        run: python tools/make_ios_project.py
      - name: Build for the simulator
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          xcodebuild -project pygame-ios.xcodeproj -target pygame-ios -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/out" build | tail -40
          ls out/Debug-iphonesimulator
      - name: Device build check (unsigned, same scheme as the TestFlight build)
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          xcodebuild -project pygame-ios.xcodeproj -scheme pygame-ios -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/out_device" build | tail -25
          ls out_device/Release-iphoneos
      - name: Run in the simulator
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screens"
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" out/Debug-iphonesimulator/pygame-ios.app
          xcrun simctl launch --console-pty "$DEV" com.hologame.holo > "$GITHUB_WORKSPACE/screens/app.log" 2>&1 &
          for s in 15 30; do
            sleep 15
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/1_first_start_${s}s.png" || true
          done
          xcrun simctl terminate "$DEV" com.hologame.holo || true
          # 2nd and 3rd start: a ready test pilot, offline (never registered on the live ranking server)
          APP=$(xcrun simctl get_app_container "$DEV" com.hologame.holo app)
          DATA=$(xcrun simctl get_app_container "$DEV" com.hologame.holo data)
          mkdir -p "$DATA/Library/Application Support/holo"
          echo '{"save_version": 999, "is_profile_set": true, "player_name": "IOS TEST", "player_country": "TR", "howto_seen": true}'             > "$DATA/Library/Application Support/holo/save_data.json"
          CFG="$APP/app/pygame-ios/config.json"
          python3 - "$CFG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(server_url="http://127.0.0.1:9", release_mode=False)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          xcrun simctl launch "$DEV" com.hologame.holo >> "$GITHUB_WORKSPACE/screens/app.log" 2>&1
          for s in 6 12 20; do
            sleep 6
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/2_menu_${s}s.png" || true
          done
          xcrun simctl terminate "$DEV" com.hologame.holo || true
          python3 - "$CFG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(perf_autoplay=[1, 2], intro=False, perf_log=True)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          xcrun simctl launch --console-pty "$DEV" com.hologame.holo > "$GITHUB_WORKSPACE/screens/play.log" 2>&1 &
          for s in 8 14 20 30; do
            sleep 6
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/3_play_${s}s.png" || true
          done
          xcrun simctl spawn "$DEV" log show --last 5m --style compact --predicate 'process == "pygame-ios"'             > "$GITHUB_WORKSPACE/screens/system.log" 2>&1 || true
          ls "$DATA/Library/Application Support/holo" > "$GITHUB_WORKSPACE/screens/save_dir.txt" 2>&1 || true
          cp "$DATA/Library/Application Support/holo/holo.log" "$GITHUB_WORKSPACE/screens/holo.log" 2>/dev/null || true
          cat "$DATA/Library/Application Support/holo/crash.log" > "$GITHUB_WORKSPACE/screens/crash.log" 2>/dev/null || true
          tail -60 "$GITHUB_WORKSPACE/screens/app.log" || true
      - name: Package the simulator app
        working-directory: build_ios/HOLO/pygame-ios-template/out/Debug-iphonesimulator
        run: ditto -c -k --keepParent pygame-ios.app "$GITHUB_WORKSPACE/HOLO-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: holo-ios-screens
          path: screens
      - uses: actions/upload-artifact@v4
        with:
          name: holo-ios-simulator
          path: HOLO-ios-simulator.zip
