name: Build HOLO iOS

# Builds the iOS app on GitHub's macOS machines (no Mac needed) and runs it in the iOS simulator.
# Actions -> "Build HOLO iOS" -> Run workflow. Artifacts:
#   holo-ios-simulator   HOLO.app for the iOS simulator (zip)
#   holo-ios-screens     simulator screenshots + the app's log (did it start, any Python error)
# A build for real iPhones / TestFlight needs an Apple Developer account (signing) - not set up yet.
# Runs only when asked (Run workflow, or a tag ios-test-N): every push used to start it, and macOS minutes count
# 10x against the private repo's monthly Actions quota - it ran out on 2026-10-13.
on:
  workflow_dispatch:
  push:
    tags: ['ios-test-*']

permissions:
  contents: write                     # the tour's logs / crash reports go to the ci-logs branch

defaults:
  run:
    shell: bash -eo pipefail {0}     # a failing xcodebuild fails the step even when piped to tail

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools
        run: pip install pygame-ios requests pygame-ce==2.5.6
      - name: Xcode project
        run: python tools/make_ios_project.py
      - name: Build for the simulator
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          xcodebuild -project pygame-ios.xcodeproj -target pygame-ios -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/out" build | tee "$RUNNER_TEMP/build.log" | tail -40
          ls out/Debug-iphonesimulator
      - name: Device build check (unsigned, same scheme as the TestFlight build)
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          xcodebuild -project pygame-ios.xcodeproj -scheme pygame-ios -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/out_device" build | tee "$RUNNER_TEMP/build_device.log" | tail -25
          ls out_device/Release-iphoneos
      - name: Run in the simulator
        working-directory: build_ios/HOLO/pygame-ios-template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screens"
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" out/Debug-iphonesimulator/pygame-ios.app
          # no simulator run ever registers a pilot on the live ranking server (it used to add a "PİLOT" each run)
          python3 - "$(xcrun simctl get_app_container "$DEV" com.hologame.holo app)/app/pygame-ios/config.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(no_register=True)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          xcrun simctl launch --console-pty "$DEV" com.hologame.holo > "$GITHUB_WORKSPACE/screens/app.log" 2>&1 &
          for s in 15 30; do
            sleep 15
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/1_first_start_${s}s.png" || true
          done
          xcrun simctl terminate "$DEV" com.hologame.holo || true
          # 2nd and 3rd start: a ready test pilot, offline (never registered on the live ranking server)
          APP=$(xcrun simctl get_app_container "$DEV" com.hologame.holo app)
          DATA=$(xcrun simctl get_app_container "$DEV" com.hologame.holo data)
          mkdir -p "$DATA/Library/Application Support/holo"
          echo '{"save_version": 999, "is_profile_set": true, "player_name": "IOS TEST", "player_country": "TR", "howto_seen": true, "level_stats": {"1": {"stars": 3, "best_score": 1000}, "2": {"stars": 3, "best_score": 1000}, "3": {"stars": 3, "best_score": 1000}, "4": {"stars": 3, "best_score": 1000}, "5": {"stars": 3, "best_score": 1000}}}'             > "$DATA/Library/Application Support/holo/save_data.json"
          CFG="$APP/app/pygame-ios/config.json"
          python3 - "$CFG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(server_url="http://127.0.0.1:9", release_mode=False)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          xcrun simctl launch "$DEV" com.hologame.holo >> "$GITHUB_WORKSPACE/screens/app.log" 2>&1
          for s in 6 12 20; do
            sleep 6
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/2_menu_${s}s.png" || true
          done
          xcrun simctl terminate "$DEV" com.hologame.holo || true
          python3 - "$CFG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(perf_autoplay="selftest", selftest_levels=[6, 7, 8], intro=False, perf_log=True)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          xcrun simctl launch --console-pty "$DEV" com.hologame.holo > "$GITHUB_WORKSPACE/screens/play.log" 2>&1 &
          for s in 10 25 40 55 70 85 100; do
            sleep 15
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/3_play_${s}s.png" || true
          done
          xcrun simctl spawn "$DEV" log show --last 5m --style compact --predicate 'process == "pygame-ios"'             > "$GITHUB_WORKSPACE/screens/system.log" 2>&1 || true
          ls "$DATA/Library/Application Support/holo" > "$GITHUB_WORKSPACE/screens/save_dir.txt" 2>&1 || true
          cp "$DATA/Library/Application Support/holo/holo.log" "$GITHUB_WORKSPACE/screens/holo.log" 2>/dev/null || true
          cat "$DATA/Library/Application Support/holo/crash.log" > "$GITHUB_WORKSPACE/screens/crash.log" 2>/dev/null || true
          tail -60 "$GITHUB_WORKSPACE/screens/app.log" || true
          # 4th start: a fresh install (no pilot, never registered) tours every screen reading the LIVE ranking
          xcrun simctl terminate "$DEV" com.hologame.holo || true
          xcrun simctl uninstall "$DEV" com.hologame.holo
          xcrun simctl install "$DEV" out/Debug-iphonesimulator/pygame-ios.app
          APP=$(xcrun simctl get_app_container "$DEV" com.hologame.holo app)
          DATA=$(xcrun simctl get_app_container "$DEV" com.hologame.holo data)
          CFG="$APP/app/pygame-ios/config.json"
          python3 - "$CFG" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])); c.update(release_mode=False, perf_autoplay="tour", intro=False, no_register=True)
          json.dump(c, open(sys.argv[1], "w"))
          PY
          rm -f ~/Library/Logs/DiagnosticReports/*pygame* 2>/dev/null || true
          xcrun simctl launch --console-pty "$DEV" com.hologame.holo > "$GITHUB_WORKSPACE/screens/tour.log" 2>&1 &
          mkdir -p "$GITHUB_WORKSPACE/tourlogs"
          for s in $(seq 5 5 120); do
            sleep 5
            xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screens/4_tour_${s}s.png" || true
            sips -Z 640 -s format jpeg "$GITHUB_WORKSPACE/screens/4_tour_${s}s.png" --out "$GITHUB_WORKSPACE/tourlogs/shot_$(printf %03d $s).jpg" >/dev/null 2>&1 || true
          done
          cp "$DATA/Library/Application Support/holo/holo.log" "$GITHUB_WORKSPACE/tourlogs/holo.log" 2>/dev/null || echo "no holo.log" > "$GITHUB_WORKSPACE/tourlogs/holo.log"
          cp "$GITHUB_WORKSPACE/screens/tour.log" "$GITHUB_WORKSPACE/tourlogs/console.log" || true
          cp ~/Library/Logs/DiagnosticReports/*pygame* "$GITHUB_WORKSPACE/tourlogs/" 2>/dev/null || echo "no crash report" > "$GITHUB_WORKSPACE/tourlogs/no_crash_report.txt"
          xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "pygame-ios"' > "$GITHUB_WORKSPACE/tourlogs/system.log" 2>&1 || true
          ls -la "$GITHUB_WORKSPACE/tourlogs"
      - name: Keep the tour logs (branch ci-logs)
        if: always()
        run: |
          [ -d "$GITHUB_WORKSPACE/tourlogs" ] || exit 0
          cp -r "$GITHUB_WORKSPACE/tourlogs" /tmp/tourlogs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs FETCH_HEAD || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          rm -rf "tour-$GITHUB_RUN_NUMBER" && mkdir "tour-$GITHUB_RUN_NUMBER" && cp /tmp/tourlogs/* "tour-$GITHUB_RUN_NUMBER/"
          tail -c 200000 "tour-$GITHUB_RUN_NUMBER/system.log" > /tmp/sys.tail && mv /tmp/sys.tail "tour-$GITHUB_RUN_NUMBER/system.log"
          git add "tour-$GITHUB_RUN_NUMBER"
          git commit -qm "ios tour logs $GITHUB_RUN_NUMBER [skip ci]"
          git push -q origin HEAD:ci-logs
      - name: Package the simulator app
        working-directory: build_ios/HOLO/pygame-ios-template/out/Debug-iphonesimulator
        run: ditto -c -k --keepParent pygame-ios.app "$GITHUB_WORKSPACE/HOLO-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: holo-ios-screens
          path: screens
      - uses: actions/upload-artifact@v4
        with:
          name: holo-ios-simulator
          path: HOLO-ios-simulator.zip
      - name: Keep the build errors (branch ci-logs)
        if: failure()
        run: |
          { grep -E "error|warning: .*(GoogleMobileAds|UserMessaging)|Undefined symbol|ld:" "$RUNNER_TEMP"/build*.log | head -150; echo ...; tail -60 "$RUNNER_TEMP"/build*.log; } > /tmp/builderr.log 2>&1 || echo "no build log" > /tmp/builderr.log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs FETCH_HEAD || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/builderr.log "build-fail-$GITHUB_RUN_NUMBER.log"
          git add "build-fail-$GITHUB_RUN_NUMBER.log"
          git commit -qm "ios build errors $GITHUB_RUN_NUMBER [skip ci]"
          git push -q origin HEAD:ci-logs
